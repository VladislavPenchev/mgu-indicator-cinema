<!doctype html><html lang="bg"><meta charset="utf-8"><title>Indicator Cinema preview</title>
<style>body{margin:32px;background:#10131b;color:#f2f3f8;font:18px system-ui}h1{font-size:28px}button,select{font:inherit;background:#263247;color:white;border:1px solid #53647a;border-radius:9px;padding:10px;margin:6px}section{display:flex;gap:20px;flex-wrap:wrap}article{background:black;border:1px solid #65728b;border-radius:14px;padding:16px}video{display:block;width:544px;max-width:80vw;aspect-ratio:16/9;object-fit:contain}.hud video{width:400px}small{color:#b9c4d6}</style>
<h1>Indicator Cinema · преглед</h1><small>Локална симулация на трите сцени. Реалните слоеве използват cluster-render.</small>
<p><select id="target"><option value="both">Километраж + HUD</option><option value="map">Километраж</option><option value="hud">Head-Up Display</option></select></p>
<button data-scene="left">← Ляв мигач</button><button data-scene="right">Десен мигач →</button><button data-scene="hazards">△ Аварийни</button><button id="stop">Стоп</button>
<p id="status">Избери сцена</p><section><article id="map"><p>Централна зона на километража</p><video muted playsinline></video></article><article id="hud" class="hud"><p>Head-Up Display</p><video muted playsinline></video></article></section>
<script>const videos=[...document.querySelectorAll('video')];function stop(){videos.forEach(v=>{v.pause();v.removeAttribute('src');v.load()});statusText('Спряно')}function statusText(s){document.querySelector('#status').textContent=s}function layout(){const t=document.querySelector('#target').value;document.querySelector('#map').hidden=t==='hud';document.querySelector('#hud').hidden=t==='map'}document.querySelector('#target').onchange=layout;document.querySelector('#stop').onclick=stop;document.querySelectorAll('[data-scene]').forEach(b=>b.onclick=()=>{videos.forEach(v=>{v.src='/'+b.dataset.scene+'.mp4';v.play()});statusText(b.textContent)});layout();</script></html>
